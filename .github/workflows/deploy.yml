name: CI/CD - Build & Deploy

on:
  push:
    branches: [ feat/workflow ]
  pull_request:
    branches: [ main ]

jobs:
  # Détection des changements
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Détecter les changements
        id: changes
        run: |
          if git diff --quiet HEAD~1 -- apps/frontend; then
            echo "frontend=false" >> $GITHUB_OUTPUT
          else
            echo "frontend=true" >> $GITHUB_OUTPUT
          fi
          
          if git diff --quiet HEAD~1 -- apps/backend; then
            echo "backend=false" >> $GITHUB_OUTPUT
          else
            echo "backend=true" >> $GITHUB_OUTPUT
          fi

  # Vérification du Frontend React
  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Nettoyer cache npm
        run: npm cache clean --force

      - name: Installer dépendances
        run: npm ci --include=optional
      
      - name: Build
        run: npm run build

      - name: Upload artifact frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          if-no-files-found: error

  # Vérification du Backend PHP
  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      
      - name: Vérifier syntaxe PHP
        run: |
          find apps/backend/src -name "*.php" -exec php -l {} \;
      
      - name: Composer validation
        working-directory: ./apps/backend
        run: composer validate --no-check-publish 2>/dev/null || echo "Pas de composer.json"
      
      - name: Tester avec Docker Compose
        working-directory: ./apps/backend
        run: |
          docker compose up -d
          docker compose ps
          docker compose logs
          docker compose down

  # Déploiement Backend sur OVH
  deploy-backend:
    needs: [changes, backend-check]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true' && needs.backend-check.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Générer .env backend depuis secrets
        run: |
          cat > .env.deploy << 'EOF'
          APP_ENV=${{ secrets.APP_ENV }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          ADMIN_USER=${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          BACKEND_HOSTNAME=${{ secrets.BACKEND_HOSTNAME }}
          BACKEND_CODE_PATH=./backend
          FRONTEND_DIST_PATH=./frontend
          APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          TRAEFIK_NETWORK=${{ secrets.TRAEFIK_NETWORK }}
          TRAEFIK_ENTRYPOINTS=${{ secrets.TRAEFIK_ENTRYPOINTS }}
          TRAEFIK_CERTRESOLVER=${{ secrets.TRAEFIK_CERTRESOLVER }}
          EOF
      
      - name: Créer clé SSH privée
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SERVER_IP: ${{ secrets.OVH_SERVER_IP }}
          OVH_PORT_SSH: ${{ secrets.OVH_PORT_SSH }}
        run: |
          mkdir -p ~/.ssh
          echo "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $OVH_PORT_SSH -H $OVH_SERVER_IP >> ~/.ssh/known_hosts

      - name: Préparer dossiers distants
        run: |
          ssh -p ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} 'mkdir -p ${{ secrets.OVH_PATH }} ${{ secrets.OVH_PATH }}/backend ${{ secrets.OVH_PATH }}/frontend ${{ secrets.OVH_PATH }}/config'

      - name: Déployer Docker Compose racine
        run: |
          scp -P ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa docker-compose.yml ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:${{ secrets.OVH_PATH }}/docker-compose.yml
          scp -P ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa .env.deploy ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:${{ secrets.OVH_PATH }}/.env
      
      - name: Déployer Backend
        run: |
          ssh -p ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} 'rm -rf ${{ secrets.OVH_PATH }}/backend/*'
          scp -P ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa -r apps/backend/* ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:${{ secrets.OVH_PATH }}/backend/
          scp -P ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa config/php.ini ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:${{ secrets.OVH_PATH }}/config/php.ini
      
      - name: Lancer Docker Compose backend
        run: |
          ssh -p ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} 'cd ${{ secrets.OVH_PATH }} && docker compose --env-file .env up -d --build --remove-orphans && docker compose ps'
      
      - name: Nettoyer clé SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # Déploiement Frontend sur OVH
  deploy-frontend:
    needs: [changes, frontend-check]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true' && needs.frontend-check.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Créer clé SSH privée
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SERVER_IP: ${{ secrets.OVH_SERVER_IP }}
          OVH_PORT_SSH: ${{ secrets.OVH_PORT_SSH }}
        run: |
          mkdir -p ~/.ssh
          echo "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $OVH_PORT_SSH -H $OVH_SERVER_IP >> ~/.ssh/known_hosts

      - name: Préparer dossiers distants
        run: |
          ssh -p ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} 'mkdir -p ${{ secrets.OVH_PATH }} ${{ secrets.OVH_PATH }}/frontend'

      - name: Déployer Frontend
        run: |
          ssh -p ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} 'rm -rf ${{ secrets.OVH_PATH }}/frontend/*'
          scp -P ${{ secrets.OVH_PORT_SSH }} -i ~/.ssh/id_rsa -r apps/frontend/dist/* ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:${{ secrets.OVH_PATH }}/frontend/

      - name: Nettoyer clé SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # Notification des résultats
  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, frontend-check, backend-check, deploy-frontend, deploy-backend]
    steps:
      - name: Résumé CI/CD
        run: |
          echo "=== Changement détecté ==="
          echo "Frontend: ${{ needs.changes.outputs.frontend }}"
          echo "Backend : ${{ needs.changes.outputs.backend }}"
          echo ""
          echo "=== Résultats checks ==="
          echo "Frontend check: ${{ needs.frontend-check.result }}"
          echo "Backend check : ${{ needs.backend-check.result }}"
          echo ""
          echo "=== Résultats déploiements (push uniquement) ==="
          echo "Deploy frontend: ${{ needs.deploy-frontend.result }}"
          echo "Deploy backend : ${{ needs.deploy-backend.result }}"
