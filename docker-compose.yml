services:
  backend:
    hostname: ${BACKEND_HOSTNAME:-localhost}
    build:
      context: ${BACKEND_CODE_PATH:-./apps/backend}
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 512m
    container_name: bellemontrewallone-backend
    restart: always
    networks:
      - default
      - traefik
      - mail-shared-network
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-belle_montre_wallone}
      DB_USER: ${DB_USER:-watch_user}
      DB_PASSWORD: ${DB_PASSWORD:-watch_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-api-key}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt}
    volumes:
      - ${BACKEND_CODE_PATH:-./apps/backend}:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/docker-php-config.ini
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-webproxy}"
      - "traefik.http.routers.bmw-api.rule=Host(`${APP_DOMAIN:-belle-montre-wallone.shop}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.bmw-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.bmw-api.tls=true"
      - "traefik.http.routers.bmw-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.bmw-api.loadbalancer.server.port=80"

  frontend:
    image: nginx:1.27-alpine
    container_name: bellemontrewallone-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - traefik
    volumes:
      - ${FRONTEND_DIST_PATH:-./apps/frontend/dist}:/usr/share/nginx/html:ro
      - ${BACKEND_CODE_PATH:-./apps/backend}/docker/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-webproxy}"
      - "traefik.http.routers.bmw-web.rule=Host(`${APP_DOMAIN:-belle-montre-wallone.shop}`)"
      - "traefik.http.routers.bmw-web.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.bmw-web.tls=true"
      - "traefik.http.routers.bmw-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.bmw-web.loadbalancer.server.port=80"

  db:
    image: mysql:9.5
    deploy:
      resources:
        limits:
          memory: 512m
    container_name: bellemontrewallone-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-belle_montre_wallone}
      MYSQL_USER: ${MYSQL_USER:-watch_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-watch_password}
    volumes:
      - db_data:/var/lib/mysql
      - ${BACKEND_CODE_PATH:-./apps/backend}/database/DBTable.sql:/docker-entrypoint-initdb.d/01.sql
      - ${BACKEND_CODE_PATH:-./apps/backend}/database/DBInsert.sql:/docker-entrypoint-initdb.d/02.sql

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-webproxy}
  mail-shared-network:
    external: true

volumes:
  db_data:
