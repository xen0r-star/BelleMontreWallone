services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: projetti_backend
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: watch_store
      DB_USER: watch_user
      DB_PASSWORD: watch_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
      ADMIN_API_KEY: change-me-api-key
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: projetti_mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: watch_store
      MYSQL_USER: watch_user
      MYSQL_PASSWORD: watch_password
    volumes:
      - db_data:/var/lib/mysql
      - ./apps/backend/database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: projetti_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
