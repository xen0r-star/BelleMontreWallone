<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Horlogerie Prestige</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              beige: '#f1f1eb',
              ivory: '#fcfcf8',
              green: '#0f4b22',
              sage: '#4f6e5b'
            }
          },
          fontFamily: {
            title: ['Cormorant Garamond', 'serif'],
            body: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-body text-lg min-h-screen text-brand-green/90">
  <div class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-20 bg-brand-ivory/85 border-b border-brand-green/20 backdrop-blur">
      <nav class="mx-auto max-w-6xl px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="font-title text-2xl font-semibold tracking-wide flex items-center gap-3">
          <img src="logo-projet.png" alt="Logo HEH Time" class="h-10 w-10 object-contain" />
          <span>HEH Time</span>
        </a>
        <div class="hidden md:flex items-center gap-6 text-lg">
          <a href="index.html" class="hover:text-brand-green">Collection</a>
          <a href="admin.html" class="hover:text-brand-green">Panel admin</a>
          <a href="#footer" class="hover:text-brand-green">A propos</a>
        </div>
        <div class="flex items-center gap-3">
          <a href="connexion.html" class="px-4 py-2 border border-brand-green/40 rounded-full bg-brand-green text-brand-ivory">Connexion</a>
          <a href="inscription.html" class="px-4 py-2 rounded-full border border-brand-green/40 hover:bg-brand-green/5">Inscription</a>
        </div>
      </nav>
    </header>

    <main class="flex-1 soft-grid flex items-center justify-center px-6 py-12">
      <section class="w-full max-w-xl rounded-3xl border border-brand-green/20 glass-panel p-8 md:p-10">
        <h1 class="font-title text-5xl">Connexion</h1>
        <p class="text-2xl mt-2 text-brand-sage">Accedez a votre espace de reservation de montres.</p>

        <form class="mt-8 space-y-5">
          <div>
            <label for="username" class="block text-xl mb-2">Username</label>
            <input id="username" type="text" class="w-full rounded-xl border border-brand-green/25 bg-brand-ivory px-4 py-3 text-xl outline-none focus:ring-2 focus:ring-brand-green/30" placeholder="votre username" />
          </div>

          <div>
            <label for="password" class="block text-xl mb-2">Password</label>
            <input id="password" type="password" class="w-full rounded-xl border border-brand-green/25 bg-brand-ivory px-4 py-3 text-xl outline-none focus:ring-2 focus:ring-brand-green/30" placeholder="votre password" />
          </div>

          <button type="submit" class="w-full mt-2 px-5 py-3 rounded-xl bg-brand-green text-brand-ivory text-xl cta-highlight">Se connecter</button>
        </form>
      </section>
    </main>

    <footer id="footer" class="border-t border-brand-green/15 bg-brand-ivory/90">
      <div class="mx-auto max-w-6xl px-6 py-6 text-center text-lg md:text-xl">
        projet technologie mobile - Haute Ecole en Hainaut - Bac 2 Developpement d application
      </div>
    </footer>
  </div>

  <script>
    const baseInputColor = '#fcfcf8';
    const formInputs = document.querySelectorAll('input');

    formInputs.forEach((input) => {
      input.addEventListener('blur', () => {
        input.style.backgroundColor = baseInputColor;
      });
    });
  </script>
</body>
</html>
